# Render Blueprint (must live at the repository root): Dashboard > New > Blueprint > pick this repo.
# The app itself is in handshake/ (rootDir below).
# Creates one web service (Docker) and one PostgreSQL database.
databases:
  - name: handshake-db
    plan: basic-256mb
    databaseName: handshake_production
    user: handshake
    postgresMajorVersion: "16"

services:
  - type: web
    name: handshake
    runtime: docker
    rootDir: handshake
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: handshake-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: AR_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_HOSTS
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: RAILS_LOG_LEVEL
        value: info
